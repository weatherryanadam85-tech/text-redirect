<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send SMS</title>
  <style>
    body {
      background: #0b0f19;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      margin: 0;
      text-align: center;
    }
    .btn {
      background: #2563eb;
      color: #ffffff;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h3>Opening Google Messages...</h3>
  <a id="smsBtn" class="btn" href="#">Tap here to Send Text</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const to = params.get('to') || '';
    const msg = params.get('msg') || '';

    if (to) {
      // Strip everything except numbers and '+' (e.g., +12672178030)
      const cleanPhone = to.replace(/[^0-9+]/g, '');
      
      // Standard Android URI format: sms:+1XXXXXXXXXX?body=YourEncodedMessage
      const smsUri = "sms:" + cleanPhone + "?body=" + encodeURIComponent(msg);
      
      const link = document.getElementById('smsBtn');
      link.href = smsUri;

      // Automatically launch messages app
      window.location.href = smsUri;
    }
  </script>
</body>
</html>
