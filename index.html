<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send SMS</title>
  <style>
    body {
      background: #0b0f19;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
      margin: 0;
    }
    .btn {
      background: #2563eb;
      color: #ffffff;
      padding: 18px 36px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>
  <a id="smsLink" class="btn" href="#">Open in Google Messages</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const to = params.get('to') || '';
    const msg = params.get('msg') || '';

    if (to) {
      // Android Intent scheme specifically targeting Google Messages
      const cleanPhone = to.replace(/[^0-9+]/g, '');
      const encodedMsg = encodeURIComponent(msg);
      
      // Native Android Intent URL
      const intentUrl = "intent://send?phone=" + cleanPhone + "&body=" + encodedMsg + "#Intent;scheme=smsto;package=com.google.android.apps.messaging;action=android.intent.action.SENDTO;end";
      
      // Fallback smsto protocol
      const smstoUrl = "smsto:" + cleanPhone + "?body=" + encodedMsg;

      const link = document.getElementById('smsLink');
      link.href = intentUrl;

      // Automatically attempt handoff, with fallback to smsto
      try {
        window.location.href = intentUrl;
      } catch (e) {
        window.location.href = smstoUrl;
      }
    }
  </script>
</body>
</html>
